# Einziger Einstiegspunkt des Stacks: statische SPA + Reverse-Proxy zur API.
# TLS/HSTS terminiert der vorgelagerte NGINX-Proxy des Betreibers.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  client_max_body_size 25m;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json;

  location = /healthz { access_log off; add_header Content-Type text/plain; return 200 "ok\n"; }

  location ~ ^/(api/|health$) {
    resolver 127.0.0.11 valid=10s;
    set $upstream http://api:3000;
    proxy_pass $upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 120s;
    proxy_request_buffering on;
  }

  location / {
    try_files $uri $uri/ /index.html;
    include /etc/nginx/conf.d/headers.inc;
  }
  location = /index.html {
    add_header Cache-Control "no-cache";
    include /etc/nginx/conf.d/headers.inc;
  }
  location ~* \.(css|js|svg|png|ico|woff2?)$ {
    add_header Cache-Control "public, max-age=300";
    include /etc/nginx/conf.d/headers.inc;
  }
}
