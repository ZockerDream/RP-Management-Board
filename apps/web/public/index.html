<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Budget Manager</title>
<script src="js/theme.js"></script>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/calendar.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body>

<main id="auth" class="auth-screen" aria-live="polite">
  <p class="auth-loading">Wird geladen…</p>
</main>

<div class="app hidden">
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark"></span>Budget Manager</div>
    <div class="nav-label first">Finanzen</div>
    <a class="nav" data-nav="dashboard" href="#/dashboard">Dashboard</a>
    <a class="nav" data-nav="transactions" href="#/transactions">Transaktionen</a>
    <a class="nav" data-nav="budgets" href="#/budgets">Budgets</a>
    <a class="nav" data-nav="recurring" href="#/recurring">Daueraufträge</a>
    <a class="nav" data-nav="goals" href="#/goals">Sparziele</a>
    <a class="nav" data-nav="reports" href="#/reports">Berichte</a>
    <div class="nav-label">Zusammenarbeit</div>
    <a class="nav" data-nav="teams" href="#/teams">Teams</a>
    <a class="nav" data-nav="calendar" href="#/calendar">Kalender</a>
    <div class="nav-label">Objekte</div>
    <a class="nav" data-nav="assets" href="#/assets">Schlüssel &amp; Objekte</a>
    <div class="nav-label" data-admin-only>Administration</div>
    <a class="nav" data-nav="admin" data-admin-only href="#/admin">Verwaltung</a>
    <a class="sidebar-user" href="#/settings">
      <span class="avatar sm" data-me></span>
      <span><b data-me-name></b></span>
    </a>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn">Menü</button>
      <div class="spacer"></div>
      <a href="#/settings" class="icon-btn" id="bell" style="text-decoration:none">Benachrichtigungen <b id="bell-n"></b></a>
      <a href="#/settings" style="text-decoration:none"><span class="avatar" data-me></span></a>
      <button class="icon-btn" type="button" data-action="logout">Abmelden</button>
    </header>
    <main id="view"></main>
  </div>
</div>

<div id="modals"></div>
<div id="toasts"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
