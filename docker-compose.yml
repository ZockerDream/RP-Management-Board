name: budget-manager

x-api-env: &api-env
  NODE_ENV: production
  TZ: ${TZ:-Europe/Berlin}
  APP_URL: ${APP_URL:?APP_URL fehlt in .env}
  DATABASE_URL: postgres://${DB_USER:-budget}:${DB_PASSWORD:?DB_PASSWORD fehlt in .env}@db:5432/${DB_NAME:-budget}
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET fehlt in .env}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY fehlt in .env}
  ADMIN_EMAIL: ${ADMIN_EMAIL:-}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
  ADMIN_NAME: ${ADMIN_NAME:-Administrator}
  ACCESS_TOKEN_TTL_SEC: ${ACCESS_TOKEN_TTL_SEC:-900}
  REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-14}
  TRUST_PROXY: ${TRUST_PROXY:-false}
  ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
  HIBP_CHECK: ${HIBP_CHECK:-false}
  HOLIDAY_COUNTRY: ${HOLIDAY_COUNTRY:-DE}
  HOLIDAY_REGION: ${HOLIDAY_REGION:-}
  MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
  BACKUP_ENCRYPT: ${BACKUP_ENCRYPT:-true}
  BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
  BACKUP_HOUR: ${BACKUP_HOUR:-3}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-RP-Management-Board <noreply@localhost>}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
  MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
  GITHUB_ISSUES_TOKEN: ${GITHUB_ISSUES_TOKEN:-}
  GITHUB_ISSUES_REPOSITORY: ${GITHUB_ISSUES_REPOSITORY:-ZockerDream/RP-Management-Board}
  LOG_LEVEL: ${LOG_LEVEL:-info}

x-hardening: &hardening
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  db:
    <<: *hardening
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-budget}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD fehlt in .env}
      POSTGRES_DB: ${DB_NAME:-budget}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks: [backend]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    <<: *hardening
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    # Update: git pull, dann docker compose up -d. pull_policy: build baut bei jedem „up“ den ausgecheckten Stand
    # (dank Cache in Sekunden), die API spielt beim Start die Migrationen ein, der Worker wartet auf sie.
    # Der Tag ist die Code-Version (beim Release mit package.json hochzählen); alte Versionen bleiben als Image erhalten.
    # IMAGE_TAG nur für Test-Stacks setzen. Ein APP_VERSION aus älteren .env-Dateien zählt nicht mehr.
    image: budget-manager-api:${IMAGE_TAG:-1.2.0}
    pull_policy: build
    environment: *api-env
    env_file:
      - path: .env-impressum
        required: false
    ports:
      - "${BIND_ADDR:-0.0.0.0}:${HTTP_PORT:-8080}:3000"
    volumes:
      - uploads:/data/uploads
      - backups:/data/backups
    networks: [backend, public]
    depends_on:
      db: { condition: service_healthy }
    read_only: true
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  worker:
    <<: *hardening
    image: budget-manager-api:${IMAGE_TAG:-1.2.0}
    # Dasselbe Image, das „api“ baut; nie aus einer Registry holen (sonst erst ein irritierendes „pull access denied“)
    pull_policy: never
    command: ["node", "src/worker.js"]
    environment: *api-env
    volumes:
      - backups:/data/backups
    networks: [backend, public]
    depends_on:
      api: { condition: service_healthy }
    read_only: true
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD", "node", "-e", "import('pg').then(async({default:pg})=>{const c=new pg.Client({connectionString:process.env.DATABASE_URL});await c.connect();await c.query('select 1');process.exit(0)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  backend:
    internal: true
  public:

volumes:
  db_data:
  uploads:
  backups:
